name: Load test

# Runs the stepped load test on every push. The job FAILS if the p95 / error-rate gate in
# locustfile.py is broken, so a performance regression blocks the merge.
on: [push, pull_request]

jobs:
  load-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run load test (fails the build if the gate is broken)
        run: python run_load_test.py
        env:
          P95_MS: "500"
          ERROR_RATE: "0.01"

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locust-report
          path: results/
